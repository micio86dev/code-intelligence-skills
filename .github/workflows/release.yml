name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read # to read the CI result for this commit
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: CI must have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status completed --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          [ "${ok:-0}" -ge 1 ] || { echo "no successful CI run for $GITHUB_SHA; refusing to release"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json and plugin.json
        run: |
          v="$(node -p "require('./package.json').version")"
          p="$(node -p "require('./.claude-plugin/plugin.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "$v" = "$p" ] || { echo "version mismatch: tag=$GITHUB_REF_NAME package=$v plugin=$p"; exit 1; }
      - run: npm test
      - run: npm pack
      - name: Extract release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Publish to npm (only when a token is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set: skipping npm publish. The GitHub release tarball is the install path."
          else
            npm publish --provenance --access public
          fi
